apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: demo
  meshConfig:
    accessLogFile: /dev/stdout
    accessLogEncoding: JSON
    accessLogFormat: |
      {"traceparent":"%REQ(TRACEPARENT)%","tracestate":"%REQ(TRACESTATE)%","x-b3-traceid":"%REQ(X-B3-TRACEID)%","path":"%REQ(:PATH)%"}
    extensionProviders:
    - name: otel
      envoyOtelAls:
        port: 4317
        service: opentelemetry-collector.observability.svc.cluster.local
    - name: skywalking
      skywalking:
        port: 11800
        service: tracing.istio-system.svc.cluster.local
    - name: otel-tracing
      opentelemetry:
        port: 4317
        service: otel-gateway-collector.observability.svc.cluster.local
